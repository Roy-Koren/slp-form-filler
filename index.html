<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דוח יומי רפלקטיבי - Voice AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .content {
            padding: 40px;
            min-height: 500px;
        }
        
        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-bottom: 40px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .question-container {
            text-align: center;
        }
        
        .question-number {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .question {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
            color: #333;
            line-height: 1.4;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 40px 0;
        }
        
        .record-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .record-button.ready {
            background: #51cf66;
            color: white;
        }
        
        .record-button.ready:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(81, 207, 102, 0.4);
        }
        
        .record-button.recording {
            background: #ff6b6b;
            color: white;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .transcript {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 60px;
            text-align: right;
            font-size: 18px;
            color: #333;
            word-wrap: break-word;
        }
        
        .transcript.empty {
            color: #999;
            font-style: italic;
        }
        
        .status {
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
        }
        
        .status.recording {
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .status.transcribing {
            color: #667eea;
        }
        
        .status.success {
            color: #51cf66;
        }
        
        .status.error {
            color: #ff6b6b;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-back {
            background: #999;
            color: white;
        }
        
        .btn-back:hover:not(:disabled) {
            background: #777;
            transform: translateY(-2px);
        }
        
        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-download {
            background: #51cf66;
            color: white;
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(81, 207, 102, 0.4);
        }
        
        .results {
            text-align: center;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .results h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #51cf66;
        }
        
        .results p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        
        .help-text {
            background: #e3f2fd;
            border-left: 4px solid #1976d2;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 14px;
            color: #1565c0;
        }
        
        @media (max-width: 600px) {
            .content { padding: 20px; }
            .question { font-size: 20px; }
            .record-button { width: 100px; height: 100px; font-size: 36px; }
            .header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 דוח יומי רפלקטיבי</h1>
            <p>השתמשו בקול כדי למלא את הטופס</p>
        </div>
        
        <div class="content">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div id="formContainer" class="question-container">
                <div class="help-text">
                    💡 לחצו על הכפתור הירוק כדי להקליט, ואז על הכפתור האדום כדי לעצור.
                </div>
                
                <div class="question-number" id="questionNumber"></div>
                <div class="question" id="questionText"></div>
                
                <div class="controls">
                    <button class="record-button ready" id="recordBtn" onclick="toggleRecording()">🎤</button>
                </div>
                
                <div class="transcript empty" id="transcript">לחצו על הכפתור כדי להקליט...</div>
                <div class="status" id="status"></div>
                
                <div class="buttons">
                    <button class="btn-back" id="backBtn" onclick="previousQuestion()" style="display:none;">← חזור</button>
                    <button class="btn-next" id="nextBtn" onclick="nextQuestion()" disabled>הבא →</button>
                </div>
            </div>
            
            <div id="resultsContainer" class="results">
                <h2>✅ הטופס הושלם!</h2>
                <p>בחרו אפשרות:</p>
                <div class="buttons">
                    <button class="btn-download" onclick="downloadDocument()">⬇️ הורד דוח</button>
                    <button class="btn-next" onclick="startNewPatient()" style="background: #2196F3;">➕ מטופל נוסף</button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>🔒 הדוח שלכם נשמר בקובץ Word וניתן להורדה מיד</p>
        </div>
    </div>
    
    <script>
        let mediaRecorder;
        let audioChunks = [];
        let currentQuestionIndex = 0;
        let formAnswers = {};
        let isRecording = false;
        let allQuestions = [];
        let currentPatientData = {};
        
        const apiUrl = window.location.origin;
        
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${apiUrl}/api/questions`);
                allQuestions = await response.json();
                showQuestion(0);
            } catch (error) {
                console.error('Error loading questions:', error);
            }
        });
        
        function showQuestion(index) {
            if (index >= allQuestions.length) {
                saveCurrentPatient();
                showResults();
                return;
            }
            
            currentQuestionIndex = index;
            const question = allQuestions[index];
            
            document.getElementById('questionNumber').textContent = 
                `שאלה ${index + 1} מתוך ${allQuestions.length}`;
            document.getElementById('questionText').textContent = question.question;
            
            const progress = ((index + 1) / allQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            document.getElementById('transcript').textContent = 'לחצו על הכפתור כדי להקליט...';
            document.getElementById('transcript').classList.add('empty');
            document.getElementById('status').textContent = '';
            document.getElementById('nextBtn').disabled = true;
            
            document.getElementById('backBtn').style.display = index > 0 ? 'block' : 'none';
            
            isRecording = false;
            updateRecordButton();
        }
        
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        async function startRecording() {
            try {
                audioChunks = [];
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await sendAudio(audioBlob);
                };
                
                mediaRecorder.start();
                isRecording = true;
                updateRecordButton();
                document.getElementById('transcript').textContent = '🔴 מקליט...';
                document.getElementById('transcript').classList.remove('empty');
                document.getElementById('status').textContent = 'הקלטה בעיצומה...';
                document.getElementById('status').className = 'status recording';
            } catch (error) {
                console.error('Microphone error:', error);
                document.getElementById('status').textContent = '❌ אין גישה למיקרופון';
                document.getElementById('status').className = 'status error';
            }
        }
        
        function stopRecording() {
            if (mediaRecorder) {
                mediaRecorder.stop();
            }
            isRecording = false;
            updateRecordButton();
            document.getElementById('status').textContent = '⏳ טרנספורמציה...';
            document.getElementById('status').className = 'status transcribing';
        }
        
        function updateRecordButton() {
            const btn = document.getElementById('recordBtn');
            if (isRecording) {
                btn.classList.remove('ready');
                btn.classList.add('recording');
                btn.textContent = '⏹️';
            } else {
                btn.classList.add('ready');
                btn.classList.remove('recording');
                btn.textContent = '🎤';
            }
        }
        
        async function sendAudio(audioBlob) {
            try {
                const question = allQuestions[currentQuestionIndex];
                const formData = new FormData();
                formData.append('audio', audioBlob, 'audio.wav');
                formData.append('question_id', question.id);
                
                const response = await fetch(`${apiUrl}/api/transcribe`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    currentPatientData[data.question_id] = data.transcription;
                    document.getElementById('transcript').textContent = data.transcription;
                    document.getElementById('transcript').classList.remove('empty');
                    document.getElementById('status').textContent = '✅ הוקלט בהצלחה';
                    document.getElementById('status').className = 'status success';
                    document.getElementById('nextBtn').disabled = false;
                } else {
                    document.getElementById('status').textContent = '❌ שגיאה בטרנספורמציה';
                    document.getElementById('status').className = 'status error';
                    document.getElementById('nextBtn').disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').textContent = '❌ שגיאת חיבור';
                document.getElementById('status').className = 'status error';
                document.getElementById('nextBtn').disabled = false;
            }
        }
        
        function nextQuestion() {
            showQuestion(currentQuestionIndex + 1);
        }
        
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }
        
        function saveCurrentPatient() {
            formAnswers = {...formAnswers, ...currentPatientData};
        }
        
        function startNewPatient() {
            currentPatientData = {};
            currentQuestionIndex = 0;
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('resultsContainer').classList.remove('show');
            showQuestion(0);
        }
        
        function showResults() {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('resultsContainer').classList.add('show');
            
            generateDocument();
        }
        
        async function generateDocument() {
            try {
                const response = await fetch(`${apiUrl}/api/generate-document`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formAnswers)
                });
                
                const data = await response.json();
                window.downloadFileName = data.file_name;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function downloadDocument() {
            if (window.downloadFileName) {
                window.location.href = `${apiUrl}/download/${window.downloadFileName}`;
            }
        }
    </script>
</body>
</html>
