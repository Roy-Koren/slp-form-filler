services:
  - type: web
    name: slp-form-filler
    runtime: python
    region: frankfurt
    plan: free
    
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    
    envVars:
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
    
    health:
      path: /health
    
    headers:
      - path: "/*"
        name: "Access-Control-Allow-Origin"
        value: "*"
    
    # Persist documents folder across deployments
    disk:
      - name: documents
        mountPath: /app/documents
        sizeGB: 10
